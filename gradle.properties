# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx1G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true

# HTTP timeouts — some dependency CDNs (Modrinth/CurseForge) are slow to transfer from this network.
systemProp.org.gradle.internal.http.connectionTimeout=120000
systemProp.org.gradle.internal.http.socketTimeout=300000

#read more on this at https://github.com/neoforged/ModDevGradle?tab=readme-ov-file#better-minecraft-parameter-names--javadoc-parchment
# you can also find the latest versions at: https://parchmentmc.org/docs/getting-started
parchment_minecraft_version=1.20.1
parchment_mappings_version=2023.09.03
# Environment Properties
# You can find the latest versions here: https://files.minecraftforge.net/net/minecraftforge/forge/index_1.20.1.html
# The Minecraft version must agree with the Forge version to get a valid artifact
minecraft_version=1.20.1
# The Minecraft version range can use any release version of Minecraft as bounds.
# Snapshots, pre-releases, and release candidates are not guaranteed to sort properly
# as they do not follow standard versioning conventions.
minecraft_version_range=[1.20.1, 1.21)
# The Forge version must agree with the Minecraft version to get a valid artifact
forge_version=47.4.0
# The Forge version range can use any version of Forge as bounds
forge_version_range=[47.4.0,)
# The loader version range can only use the major version of FML as bounds
loader_version_range=[47,)

## Mod Properties

# The unique mod identifier for the mod. Must be lowercase in English locale. Must fit the regex [a-z][a-z0-9_]{1,63}
# Must match the String constant located in the main mod class annotated with @Mod.
mod_id=sortbomaterial
# The human-readable display name for the mod.
mod_name=Sort BoMaterial
# The license of the mod. Review your options at https://choosealicense.com/. All Rights Reserved is the default.
mod_license=LGPL-3.0
# The mod version. See https://semver.org/
mod_version=1.0.0
# The group ID for the mod. It is only important when publishing as an artifact to a Maven repository.
# This should match the base package used for the mod sources.
# See https://maven.apache.org/guides/mini/guide-naming-conventions.html
mod_group_id=io.github.linkfgfgui.sortbomaterial
# The authors of the mod, displayed in the mod UI.
mod_authors=linkfgfgui
# The description of the mod, displayed in the mod UI.
mod_description=Reorders Project Expansion's Arcane Transmutation Tablet item list so materials required by EMI's active recipe tree (BoM) come first.

# Dependency versions
# EMI (https://github.com/emilyploszaj/emi) - recipe viewer
# Latest 1.20.1 Forge release on Modrinth. Served via the Modrinth maven
# (the TerraformersMC maven backend is unreachable from some networks).
emi_version=1.1.16+1.20.1+forge
# Project Expansion (https://modrinth.com/mod/project-expansion) - ProjectE addon
# CurseForge file id 7247734 = Project Expansion 1.20.1-1.1.3 (Forge). CurseForge project id 579177.
project_expansion_version=7247734
# ProjectE (https://github.com/sinkillerj/ProjectE) - transmutation, required by Project Expansion
# CurseMaven file id 4901949 = ProjectE 1.20.1 release.
projecte_version=4901949
